<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <title>준혁T의 과학 실험실 · 호기심이 시작되는 곳</title>
  <link rel="stylesheet" href="/home.css">
</head>
<body>
  <a class="skip" href="#experiments">실험 목록으로 건너뛰기</a>
  <div class="cosmos" aria-hidden="true"><div class="stars"></div><div class="galaxy"></div><div class="horizon"></div></div>
  <header class="site-header"><a class="brand" href="./"><span class="brand-star" aria-hidden="true">✦</span> 준혁T의 과학 실험실</a><a class="nav-link" href="#experiments">실험 둘러보기 <span aria-hidden="true">↗</span></a></header>
  <main>
    <section class="hero" aria-labelledby="welcome">
      <p class="eyebrow"><span></span> 작은 질문에서 시작하는 발견</p>
      <h1 id="welcome">너의 호기심이<br>새로운 세계를 열도록.</h1>
      <p class="hero-description">직접 움직이고, 관찰하고, 발견해 보세요.<br>과학을 만나는 또 하나의 방법.</p>
      <a class="explore" href="#experiments">어떤 실험을 해 볼까요? <span aria-hidden="true">↓</span></a>
    </section>
    <section class="experiments" id="experiments" aria-labelledby="experiment-title">
      <div class="section-heading"><div><h2 id="experiment-title">나만의 탐구를 시작해요</h2></div><span class="available">1개의 실험이 열려 있어요</span></div>
      <div class="folders">
        <a class="folder active-folder grade-folder" href="./grades/middle-school-2/" aria-label="중학교 2학년 과학 폴더 열기">
          <span class="folder-tab">학년</span>
          <div class="folder-face">
            <div class="folder-top"><span class="subject">과학 탐구</span><span class="open-mark" aria-hidden="true">↗</span></div>
            <div class="future-art" aria-hidden="true"><div class="planet"></div><span class="small-star">✧</span></div>
            <div class="folder-copy"><span class="grade">실험 1개 · 준비 중 2개</span><h3>중학교 2학년 과학</h3><p>우리 학년의 실험을 한곳에서 만나 보세요.</p></div>
            <div class="folder-footer">폴더 열기 <span aria-hidden="true">→</span></div>
          </div>
        </a>
      </div>
    </section>
  </main>
  <footer class="site-footer"><span>✦ 준혁T의 과학 실험실</span><p>궁금한 만큼, 더 넓어지는 세상.</p></footer>
